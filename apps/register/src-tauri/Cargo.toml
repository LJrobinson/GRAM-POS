[package]
name = "gram-pos-register"
version = "0.7.0"
edition = "2021"
description = "Local-only GRAM POS register desktop prototype"
publish = false

# Keep the desktop runtime and its system dependencies out of the portable
# pricing core's MSRV, WebAssembly checks, and dependency-free lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gram-register-service = { path = "../../../crates/register-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
# Safe selected-file opens: reject symlinks and avoid blocking on special files.
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
